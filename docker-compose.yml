services:
  postgres:
    image: postgres:16-alpine
    container_name: reach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reach_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reach_password}
      POSTGRES_DB: ${POSTGRES_DB:-reach_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reach_pgdata:/var/lib/postgresql/data
      - ./DB/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reach_user} -d ${POSTGRES_DB:-reach_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: reach_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reach_user}:${POSTGRES_PASSWORD:-reach_password}@postgres:5432/${POSTGRES_DB:-reach_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-reach_super_secret_jwt_key_change_in_production_2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PORT: 8080
      HOST: "0.0.0.0"
      APP_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  reach_pgdata:
    driver: local
