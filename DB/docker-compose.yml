services:
  postgres:
    image: postgres:16-alpine
    container_name: reach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reach_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reach_password}
      POSTGRES_DB: ${POSTGRES_DB:-reach_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reach_user} -d ${POSTGRES_DB:-reach_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
